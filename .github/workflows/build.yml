name: Build and Publish NestJS Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Firebase service account file
        run: |
          # public/ is gitignored (contains the Firebase admin SDK secret key).
          # Recreate it from a repository secret so it exists in the Docker
          # build context for the TypeScript import in firebase.service.ts.
          # Add this secret to your repo: Settings > Secrets and variables >
          # Actions > FIREBASE_SERVICE_ACCOUNT (paste the full JSON content).
          #
          # Use a quoted heredoc so the secret is written verbatim (quotes,
          # newlines and the PEM private key are preserved exactly). `echo`
          # would strip/mangle them and produce invalid JSON.
          mkdir -p public
          cat > public/firebase-service-account.json << 'FIREBASE_SA_EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SA_EOF

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            NODE_ENV=prod
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: true
          load: true

      - name: Verify dist/src/main.js exists in built image
        run: |
          if docker run --rm ${{ env.IMAGE_NAME }}:latest test -f /usr/src/app/dist/src/main.js; then
            echo "✅ dist/src/main.js found in built image"
            docker run --rm ${{ env.IMAGE_NAME }}:latest ls -la /usr/src/app/dist/src/main.js
          else
            echo "❌ ERROR: dist/src/main.js is missing in the built image!"
            echo "   The Docker build did not compile TypeScript correctly."
            exit 1
          fi

      - name: Publish Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NODE_ENV=prod
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: true

      - name: Deploy to VPS
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Write .env from GitHub secret using heredoc (preserves special chars, newlines, quotes)
            cat > .env << 'ENV_EOF'
            ${{ secrets.VPS_ENV_FILE }}
            ENV_EOF

            # Verify .env was written correctly (mask sensitive values in logs)
            echo "=== .env file contents (sensitive values masked) ==="
            grep -E "DB_HOST|DB_PORT|DB_USERNAME|DB_NAME|DATABASE_URL" .env || true
            echo "=================================================="

            # Authenticate to GHCR so the VPS can pull the published image.
            # Requires repo secrets: VPS_GHCR_USER (GitHub username) and
            # VPS_GHCR_PAT (Personal Access Token with read:packages scope).
            echo "${{ secrets.VPS_GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.VPS_GHCR_USER }}" --password-stdin

            # Pull the latest app image from GHCR
            docker compose pull nestjs-app

            # Recreate the app container with the latest image (postgres/pgadmin left running)
            docker compose up -d --force-recreate --no-deps nestjs-app

            # Prune unused images
            docker image prune -f
